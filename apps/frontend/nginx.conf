server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresivo para assets con hash en el nombre (JS/CSS de Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}